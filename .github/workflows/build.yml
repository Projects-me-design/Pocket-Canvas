name: Build installers

# Runs when you push a version tag (e.g. v1.1.0) or press "Run workflow" on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Sync merge tests
        run: node tests/merge.test.js
      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1400x900x24" npx electron --no-sandbox tests/smoke.js
      - name: Feature tests
        run: xvfb-run -a -s "-screen 0 1400x900x24" npx electron --no-sandbox tests/features.js
      - name: Browser extension test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          xvfb-run -a -s "-screen 0 1400x900x24" node tests/extension.test.js
      - name: Package the browser extension
        run: node scripts/build-extension.js
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-canvas-browser-extension
          path: dist/*.zip
      - name: Attach extension to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: pocket-canvas-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          if-no-files-found: ignore
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
