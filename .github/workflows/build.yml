# Pocket-Canvas — Copyright (c) 2026 project-tech-me <project-tech-me@protonmail.com>
name: Build installers

# Runs when you push a version tag (e.g. v1.1.0) or press "Run workflow" on GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      mac:
        description: 'Also build the Mac, iPhone/iPad and Safari versions (untick if GitHub''s Mac machines are busy or down)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CI: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Install the server's packages
        run: cd server && (npm ci || npm install)
      - name: Sync merge tests
        run: node tests/merge.test.js
      - name: Server tests
        run: node tests/server.test.js
      - name: Install the libraries Electron needs on Linux
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0t64
      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1400x900x24" npx electron --no-sandbox tests/smoke.js
      - name: Feature tests
        run: xvfb-run -a -s "-screen 0 1400x900x24" npx electron --no-sandbox tests/features.js
      - name: Browser extension test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          xvfb-run -a -s "-screen 0 1400x900x24" node tests/extension.test.js
      - name: Android app screens test
        run: node tests/mobile-web.test.js
      - name: Package the browser extension
        run: node scripts/build-extension.js
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-canvas-browser-extension
          path: dist/*.zip
      - name: Attach extension to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip

  build:
    needs: test
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is named directly (not macos-latest) so the build doesn't change when GitHub moves the label.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.mac) && '["windows-latest","ubuntu-24.04"]' || '["windows-latest","ubuntu-24.04","macos-26"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      # Signing switches itself on when the matching secrets exist
      # (see docs/RELEASING.md). With no secrets, unsigned installers are built.
      - name: Build installer
        shell: bash
        env:
          # macOS: Developer ID Application certificate + notarisation
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows option A: Azure Artifact Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ENDPOINT: ${{ vars.AZURE_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
          # Windows option B: a .pfx certificate file (testing or older certificates)
          WIN_CERTIFICATE: ${{ secrets.WIN_CERTIFICATE }}
          WIN_CERTIFICATE_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
        run: |
          args=(--publish never)
          signing=no
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERTIFICATE" ]; then
            export CSC_LINK="$MAC_CERTIFICATE" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            signing=yes
            if [ -z "$APPLE_ID" ]; then
              echo "::warning::Signed but NOT notarised: APPLE_ID secret is missing."
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            fi
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_ID" ]; then
            args+=("-c.win.azureSignOptions.endpoint=$AZURE_ENDPOINT"
                   "-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT"
                   "-c.win.azureSignOptions.certificateProfileName=$AZURE_CERT_PROFILE"
                   "-c.win.azureSignOptions.publisherName=$AZURE_PUBLISHER_NAME")
            signing=yes
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERTIFICATE" ]; then
            export WIN_CSC_LINK="$WIN_CERTIFICATE" WIN_CSC_KEY_PASSWORD="$WIN_CERTIFICATE_PASSWORD"
            signing=yes
          fi
          if [ "$signing" = "no" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "::notice::No signing secrets for $RUNNER_OS - building unsigned."
          fi
          unset MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD WIN_CERTIFICATE WIN_CERTIFICATE_PASSWORD
          npx electron-builder "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-canvas-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
          if-no-files-found: ignore
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg

  # The Android app (APK). Built from the same screens as the desktop app; see docs/ANDROID.md.
  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci || npm install
      - name: Prepare the app's screens
        run: |
          node scripts/build-mobile-web.js
          npx cap sync android
      - name: Use your own signing key, if you've added one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::notice::Signing the APK with your own key."
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret - signing with the test key."
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Pocket-Canvas-$VERSION-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-canvas-android
          path: dist/*.apk
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk

  # iPhone and iPad app (Capacitor). Builds for the iOS Simulator, plus an unsigned .ipa you can
  # sign and install with your own Apple ID (see docs/IOS.md).
  ios:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.mac
    timeout-minutes: 60
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install
      - name: Prepare the app's screens
        run: |
          node scripts/build-mobile-web.js
          npx cap sync ios
      - name: Set the version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number); a*10000+b*100+c")
          sed -i '' -e "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/" -e "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $BUILD;/" ios/App/App.xcodeproj/project.pbxproj
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-sim CODE_SIGNING_ALLOWED=NO build
          mkdir -p dist
          (cd build/ios-sim/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/dist/Pocket-Canvas-$VERSION-ios-simulator.zip" App.app)
      - name: Build an unsigned app for iPhone and iPad
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p build/ipa/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/dist/Pocket-Canvas-$VERSION-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-canvas-ios
          path: |
            dist/*.ipa
            dist/*-ios-simulator.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.ipa
            dist/*-ios-simulator.zip

  # The browser extension for Safari on the Mac: Apple's converter turns the same extension into
  # a small Mac app that carries it. The converter's report is saved alongside (see docs/SAFARI.md).
  safari:
    needs: test
    if: github.event_name != 'workflow_dispatch' || inputs.mac
    timeout-minutes: 45
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Convert the extension for Safari
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node scripts/build-extension.js
          mkdir -p dist
          xcrun safari-web-extension-converter browser-extension \
            --project-location build/safari --app-name "Pocket-Canvas Web Clipper" \
            --bundle-identifier com.projecttechme.pocketcanvas.webclipper \
            --swift --macos-only --copy-resources --no-open --no-prompt --force 2>&1 | tee dist/safari-converter-report.txt
      - name: Check the converter found nothing unsupported
        run: |
          if grep -qiE "not supported|unsupported" dist/safari-converter-report.txt; then
            echo "::warning::Safari doesn't support everything in the extension. See safari-converter-report.txt."
          else
            echo "Safari supports every key and permission the extension uses."
          fi
      - name: Build the Safari extension app
        run: |
          PROJ=$(find build/safari -name "*.xcodeproj" -maxdepth 3 | head -1)
          xcodebuild -project "$PROJ" -scheme "Pocket-Canvas Web Clipper" -configuration Release \
            -derivedDataPath build/safari-dd CODE_SIGNING_ALLOWED=NO build
          (cd build/safari-dd/Build/Products/Release && zip -qry "$GITHUB_WORKSPACE/dist/Pocket-Canvas-Web-Clipper-$VERSION-safari.zip" "Pocket-Canvas Web Clipper.app")
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-canvas-safari-extension
          path: |
            dist/*-safari.zip
            dist/safari-converter-report.txt
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*-safari.zip
